site_name: dialog2agent
site_url: https://jumafernandez.github.io/dialog2agent/
site_description: Build task-oriented dialogue agents that decide over structures induced from your own conversations.
repo_url: https://github.com/jumafernandez/dialog2agent
repo_name: jumafernandez/dialog2agent
theme:
  name: material
  language: en
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      primary: deep purple
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: deep purple
      toggle: {icon: material/weather-sunny, name: Light mode}
# language selector of the header: the English documentation at the root of the site and the Spanish one under es/
extra:
  alternate:
    - name: English
      link: /dialog2agent/
      lang: en
    - name: Español
      link: /dialog2agent/es/
      lang: es
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Models: models.md
  - Build your own domain: build-a-domain.md
  - Serving the agent: serving.md
  - Evaluation: evaluation.md
  - Web demo: demo.md
  - API reference: api/index.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - tables
