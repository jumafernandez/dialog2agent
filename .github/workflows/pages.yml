# Documentation and web demo on GitHub Pages: the documentation at the root of the site and the demo at demo.html.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mkdocstrings reads the sources without importing them, so the dependencies of the library are not needed
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5" "mkdocstrings[python]>=0.25"
      - run: mkdocs build --strict
      - run: mkdocs build --strict -f mkdocs.es.yml
      - name: Add the web demo
        run: |
          cp demo/demo.html demo/demo.css demo/demo.js site/
          mkdir -p site/data
          cp demo/data/replay.json demo/data/LICENSE.md site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
